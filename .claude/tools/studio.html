  for (let t = 0; t <= total; t += step) rl.append(h('span', { class: 'tick', style: `left:${t * scale}px;transform:translateX(${t === 0 ? '0' : (t * scale + 16 > W + 8 ? '-100%' : '-50%')})` }, fmt(t).replace(/\.\d$/, '')));
  rl.append(h('div', { class: 'tlmarks', id: 'tlMarks' }), h('div', { class: 'ph', id: 'tlHeadMark' }));
  inner.append(row('时间', 'ruler-row', true, rl));
  if (open) {
    const pps = TL.pps, blk = (w, cls) => (w < 24 ? cls + ' narrow' : cls);
    const vl = lane();
    d.V.forEach(c => vl.append(h('button', { class: blk(c.dur * pps, 'clip' + (c.kind === 'live' || c.kind === 'image' ? ' video' : '')), type: 'button', 'data-v': c.i, title: `第 ${c.i + 1} 镜 · ${c.id} · ${fmt(c.start)}–${fmt(c.start + c.dur)}`, 'aria-selected': TL.sel?.type === 'V' && TL.sel.i === c.i ? 'true' : 'false', style: `left:${c.start * pps}px;width:${Math.max(2, c.dur * pps - 1)}px`, onclick: e => { e.stopPropagation(); tlSelect('V', c.i); } },
      c.kind === 'live' ? h('span', { class: 'wave' }) : null, h('span', { class: 'name' }, c.kind === 'black' ? '黑' : c.kind === 'white' ? '白' : c.id))));
    inner.append(row('画面', 'v', false, vl, `${d.V.length} 镜`));
    if (d.subs.length) { const sl = lane(); d.subs.forEach(x => sl.append(h('div', { class: 'clip sub', title: x.text, style: `left:${x.start * pps}px;width:${Math.max(2, (x.end - x.start) * pps - 1)}px` }, h('span', { class: 'name' }, x.text)))); inner.append(row('台词/旁白', '', true, sl, `${d.subs.length} 句`)); }
    for (const [kind, name] of Object.entries(KIND)) {
      const items = d.A.filter(x => x.kind === kind); if (!items.length) continue;
      const al = lane();
      items.forEach(x => al.append(h('button', { class: blk(x.dur * pps, 'clip audio'), type: 'button', 'data-a': x.i, title: `${x.name} · ${fmt(x.start)} · ${x.dur.toFixed(1)}s · ${x.gain} dB`, 'aria-selected': TL.sel?.type === 'A' && TL.sel.i === x.i ? 'true' : 'false', style: `left:${x.start * pps}px;width:${Math.max(2, x.dur * pps - 1)}px`, onclick: e => { e.stopPropagation(); tlSelect('A', x.i); } },
        h('span', { class: 'wave' }), h('span', { class: 'name' }, x.name.replace(/\.[^.]+$/, '') + (x.loop ? ' ↻' : '')))));
      inner.append(row(name, '', kind === 'sfx', al, `${items.length}`));
    }
  }
  inner.append(h('div', { class: 'playhead', id: 'tlHeadLine' }));
  inner.onclick = e => { const l = e.target.closest('.tl-lane'); if (!l) return; const r = l.getBoundingClientRect(); $('#video').pause(); seek(Math.max(0, Math.min(total, (e.clientX - r.left) / scale))); };
  tlDrawMarks(); tlTime($('#video')?.currentTime || 0);
  // 右栏收起时用户要的是大画面：播放器只按窗口高度限，时间线顺到下面去
  const pv = $('#preview'); if (pv) pv.style.setProperty('--tl-h', ((UI.auxOpen || isNarrow()) ? ($('#tlBlock')?.offsetHeight || 0) : 0) + 'px');
}
function tlDrawMarks() {
  const box = $('#tlMarks'); if (!box) return; box.innerHTML = ''; const sc = TL.scale || 0;
  (S.markers || []).filter(m => m.version === shown()?.version).forEach(m => box.append(h('button', { class: 'mk', type: 'button', title: `${m.tc} ${m.note}`, 'aria-label': `标记 ${m.tc}`, style: `left:${m.t * sc}px`, onclick: e => { e.stopPropagation(); seek(m.t); $('#video').pause(); } })));
  (S.docMarks || []).forEach(t => box.append(h('button', { class: 'mk doc', type: 'button', title: `自审里提到 ${fmt(t)}`, 'aria-label': `自审 ${fmt(t)}`, style: `left:${t * sc}px`, onclick: e => { e.stopPropagation(); seek(t); $('#video').pause(); } })));
}
function tlTime(t) {
  const line = $('#tlHeadLine'), mk = $('#tlHeadMark'), lane = $('#tlRuler'); if (!lane) return;
  const sc = TL.scale || 0, x = lane.offsetLeft + t * sc;
  if (line) line.style.left = x + 'px'; if (mk) mk.style.left = (t * sc) + 'px';
  const scr = $('#tlScroll'), vid = $('#video');
  if (scr && (TL.ensure || (vid && !vid.paused)) && (x < scr.scrollLeft + 140 || x > scr.scrollLeft + scr.clientWidth - 40)) scr.scrollLeft = Math.max(0, x - scr.clientWidth * 0.3);
  TL.ensure = false;
  const d = TL.data; if (!d?.found) return;
  const cur = d.V.find(c => t >= c.start && t < c.start + c.dur) || null;
  const at = $('#atShot'); if (at) at.textContent = cur ? `第 ${cur.i + 1} 镜 · ${cur.id}` : '';
  const sel = TL.sel; let next = sel;
  if (!sel || sel.type === 'V') { if (!cur) next = null; else if (!sel || sel.i !== cur.i) next = { type: 'V', i: cur.i }; }
  else { const a = d.A[sel.i]; if (t < a.start - 0.05 || t > a.start + a.dur) next = cur ? { type: 'V', i: cur.i } : null; }
  if (next?.type !== sel?.type || next?.i !== sel?.i) { TL.sel = next; tlMarkSel(); if (S.auxTab === 'shot') renderAuxWatch(); }
}
function tlMarkSel() { $$('#tlInner .clip[data-v], #tlInner .clip[data-a]').forEach(el => el.setAttribute('aria-selected', TL.sel && (TL.sel.type === 'V' ? el.dataset.v : el.dataset.a) === String(TL.sel.i) ? 'true' : 'false')); }
function tlSelect(type, i) { const it = type === 'V' ? TL.data.V[i] : TL.data.A[i]; TL.sel = { type, i }; tlMarkSel(); $('#video').pause(); seek(it.start + 0.02); S.auxTab = 'shot'; renderAuxWatch(); openAux(); }
function tlSetPps(p, tAnchor, xScreen) {
  const sc = $('#tlScroll'); if (!sc || !TL.data?.found) return; p = Math.min(TL.max, Math.max(TL.fit, p));
  const lane = $('#tlRuler');
  if (xScreen == null) { const cur = lane.offsetLeft + (tAnchor || 0) * TL.pps - sc.scrollLeft; xScreen = (cur >= 0 && cur <= sc.clientWidth) ? cur : sc.clientWidth / 2; }
  TL.pps = p; TL.z = p / TL.fit; tlSavePrefs(); tlDraw();
  sc.scrollLeft = Math.max(0, $('#tlRuler').offsetLeft + (tAnchor || 0) * p - xScreen);
  const sl = $('#tlZoom'); if (sl) sl.value = tlSliderVal(); const w = $('#tlWin'); if (w) w.textContent = tlWindowText();
}
function tlZoom(f) { if (!TL.data?.found || !TL.open) return; tlSetPps(TL.pps * f, $('#video')?.currentTime || 0); }
function tlWheel(e) {
  const sc = $('#tlScroll'); if (!sc || !TL.data?.found || !TL.open) return;
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); const r = $('#tlRuler').getBoundingClientRect(); const t = Math.max(0, (e.clientX - r.left) / TL.pps); tlSetPps(TL.pps * Math.pow(1.0025, -e.deltaY), t, e.clientX - sc.getBoundingClientRect().left); return; }
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && sc.scrollWidth > sc.clientWidth) { e.preventDefault(); sc.scrollLeft += e.deltaY; }
}
function tlAuxHead() {
  const d = TL.data, sel = TL.sel;
  if (!d?.found || !sel) return ['这一镜', shown()?.version || ''];
  if (sel.type === 'V') { const c = d.V[sel.i]; return [`第 ${sel.i + 1} 镜 · ${c.id}`, `${fmt(c.start)}–${fmt(c.start + c.dur)}`]; }
  const x = d.A[sel.i]; return [`${KIND[x.kind] || x.kind} · ${x.name}`, `${fmt(x.start)} · ${x.dur.toFixed(1)}s`];
}
function renderShotTab(a) {
  const d = TL.data;
  if (!d?.found) { a.append(h('div', { class: 'empty', style: 'padding:32px 8px' }, h('div', { class: 'h' }, '还没有剪辑表'), h('p', {}, '剪辑技能写出 剪辑/剪辑表.py 之后，这里显示播放头所在那一镜来自哪段素材、声音怎么落。'))); return; }
  const sel = TL.sel;
  if (!sel) { a.append(h('p', { class: 's t3' }, '播放头走到哪一镜，这里就显示哪一镜；点时间线上的块也行。')); return; }
  if (sel.type === 'V') {
    const c = d.V[sel.i], end = c.start + c.dur;
    if (c.kind === 'live') a.append(c.exists ? h('video', { class: 'srcv', src: fileUrl(c.src) + `#t=${c.in},${c.out}`, controls: true, preload: 'none', muted: !c.a, title: '只播这一镜用的那一段' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '源文件不在这个项目里 · ', h('span', { class: 'path' }, c.src))));
    else if (c.kind === 'image') a.append(c.exists ? h('img', { class: 'srcv', src: fileUrl(c.src), alt: c.id, style: 'object-fit:contain' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '图不在这个项目里 · ', h('span', { class: 'path' }, c.src))));
    else a.append(h('div', { class: 'notice' }, h('div', { class: 'b' }, c.kind === 'title' ? '片名卡：' + c.id : c.kind === 'black' ? '黑场' : '白场')));
    a.append(h('dl', { class: 'kv', style: 'margin-top:12px' },
      kv('来源', c.kind === 'live' || c.kind === 'image' ? h('span', { class: 'path' }, c.src) : null),
      kv('入点 / 出点', c.kind === 'live' ? `${c.in} → ${c.out}（${c.dur.toFixed(2)} 秒${c.freeze ? '，含定格 ' + c.freeze : ''}）` : `${c.dur.toFixed(2)} 秒`),
      kv('调色', `${c.grade || '默认'}${c.matte === false ? ' · 不走 LOOK' : ''}`),
      kv('原声', c.kind === 'live' ? (c.a ? `${c.a}` : '不要') : null),
      kv('淡入 / 淡出', (c.fi || c.fo) ? `${c.fi || 0} / ${c.fo || 0} 秒` : null)));
    if (c.kind === 'live') a.append(h('div', { style: 'margin-top:12px' }, h('button', { class: 'pill sm', type: 'button', title: '到进度页看这一段参考了什么、提示词、候选', onclick: () => openSegmentFor(c) }, '看这一段的生成记录')));
    const over = d.A.filter(x => x.start < end && x.start + x.dur > c.start);
    if (over.length) a.append(h('div', { class: 'aux-sec' }, h('div', { class: 'k' }, `这一镜里的声音 · ${over.length}`), ...over.map(x => h('div', { class: 'srow' }, h('span', { class: 'badge neutral' }, KIND[x.kind] || x.kind), h('button', { class: 'link ellipsis', type: 'button', style: 'min-width:0;text-align:left', onclick: () => tlSelect('A', x.i) }, x.name), h('span', { class: 'mono t3' }, `${fmt(x.start)} · ${x.gain} dB`)))));
  } else {
    const x = d.A[sel.i];
    a.append(x.exists ? h('audio', { src: fileUrl(x.src), controls: true, preload: 'none', style: 'width:100%' }) : h('div', { class: 'notice warn' }, h('div', { class: 'b' }, '声音文件不在这个项目里 · ', h('span', { class: 'path' }, x.src))));
    a.append(h('dl', { class: 'kv', style: 'margin-top:12px' },
      kv('来源', h('span', { class: 'path' }, x.src)),
      kv('落点', `${fmt(x.start)}，长 ${x.dur.toFixed(1)} 秒${x.loop ? '，循环' : ''}${x.in ? '，源入点 ' + x.in : ''}`),
      kv('电平', `${x.gain} dB${x.norm != null ? '，先归一到 ' + x.norm : ''}${x.duck ? '，对白时让路' : ''}`),
      kv('淡入 / 淡出', (x.fi || x.fo) ? `${x.fi || 0} / ${x.fo || 0} 秒` : null),
      kv('处理', [x.fx, x.raw ? '不柔化' : '', x.clarity ? '对白链' : ''].filter(Boolean).join(' · ') || null),
      kv('包络', x.env.length ? x.env.map(e => `${fmt(e[0])} ${e[1] > 0 ? '+' : ''}${e[1]} dB`).join('，') : null),
      kv('落点（多次）', x.hits.length ? x.hits.map(fmt).join('，') : null)));
  }
}

/* ---------- 灯箱 */
function openLightbox(list, idx) {
  S.lb = { list, idx }; const lb = $('#lightbox'); lb.innerHTML = ''; lb.hidden = false;
  const x = list[idx];
  lb.append(h('button', { class: 'x', type: 'button', 'aria-label': '关闭', html: ICON.x, onclick: closeLightbox }));
  if (list.length > 1) { lb.append(h('button', { class: 'nav-l', type: 'button', 'aria-label': '上一张', html: ICON.left, onclick: e => { e.stopPropagation(); openLightbox(list, (idx - 1 + list.length) % list.length); } })); lb.append(h('button', { class: 'nav-r', type: 'button', 'aria-label': '下一张', html: ICON.right, onclick: e => { e.stopPropagation(); openLightbox(list, (idx + 1) % list.length); } })); }
  lb.append(h('img', { class: 'img', src: fileUrl(x.path), alt: x.name, onclick: e => e.stopPropagation() }));
  lb.append(h('div', { class: 'cap' }, `${x.lab ? x.lab + ' · ' : ''}${x.path}${list.length > 1 ? `  ${idx + 1} / ${list.length}` : ''}`));
  lb.onclick = closeLightbox;
  $('.x', lb).focus();
}
function closeLightbox() { const lb = $('#lightbox'); lb.hidden = true; lb.innerHTML = ''; S.lb = null; }

/* ---------- 键盘 */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (S.lb) { if (e.key === 'Escape') closeLightbox(); else if (e.key === 'ArrowLeft') $('#lightbox .nav-l')?.click(); else if (e.key === 'ArrowRight') $('#lightbox .nav-r')?.click(); return; }
  if (e.key === 'Escape') { if (S.draft) cancelDraft(); else closeAux(); return; }
  if (typing) { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'draftNote') { e.preventDefault(); saveDraft(); } return; }
  if (S.view !== 'watch' || !S.cur) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? seek($('#video').currentTime - 1) : step(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? seek($('#video').currentTime + 1) : step(1); }
  else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); mark(); }
  else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); toggleBlink(); }
  else if (e.key === '=' || e.key === '+') { e.preventDefault(); tlZoom(1.5); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); tlZoom(1 / 1.5); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); jumpCut(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); jumpCut(-1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFull(); }
});

/* ---------- 起 */
async function boot() {
  try {
    S.proj = await api('/api/project');
    [S.finals, TL.data] = await Promise.all([api('/api/finals'), api('/api/timeline').catch(() => ({ found: false }))]);
    await loadFeedback(); tlLoadPrefs();
  } catch (e) {
    $('#v-watch').innerHTML = `<div class="empty bad"><div class="h">连不上放映室的服务器</div><p>${esc(e.message)}</p></div>`; return;
  }
  document.title = `Lazy Studio · ${S.proj.name}`;
  $('.nav .brand').title = `Lazy Studio · ${S.proj.name}`;
  renderWatch(); renderAuxWatch(); switchView(['progress', 'library'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'watch'); applyUI();
  setInterval(pollStat, 3000);
  window.__studio = { S, TL, pollStat, live: () => LIVE };   // 给自测脚本看内部状态用
}
boot();
})();
